name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + deterministic eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Unit, pipeline and API tests. The model is a scripted fake and the
      # database is in-memory: no API key, network, or database server needed.
      - run: npm test
      # Deterministic eval (retrieval + rule-based safety layer, ~320 labeled
      # cases, no model calls), then a regression check against the committed
      # baseline in eval/baselines/offline.json. Fails on any safety regression
      # or net retrieval loss; see eval/thresholds.json for the reasoning.
      - run: npm run eval:check
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval-report
          path: |
            backend/eval/results/offline/eval-report.md
            backend/eval/results/offline/eval-results.json
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
