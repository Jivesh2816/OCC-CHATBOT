<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .brand { font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#e7e3d5"/>

  <text x="90" y="120" class="mono" font-size="15" letter-spacing="3" fill="#8c8b85">OFF-CAMPUS COMMUNITY</text>

  <rect x="90" y="150" width="1020" height="300" rx="10" fill="#20402f"/>
  <rect x="90" y="150" width="8" height="300" rx="4" fill="#e0932f"/>

  <text x="140" y="270" class="brand" font-size="56" font-weight="700" fill="#f5f3ec">What do you need to sort out?</text>
  <text x="140" y="320" class="brand" font-size="24" fill="#b9c4bb">Housing, rent, transit, health, food, and campus rules</text>
  <text x="140" y="356" class="brand" font-size="24" fill="#b9c4bb">for University of Waterloo off-campus students.</text>

  <g class="mono" font-size="16" fill="#f5f3ec">
    <circle cx="150" cy="410" r="5" fill="#e0932f"/>
    <text x="168" y="415">42 FAQs answered live &#183; Groq GPT-OSS 20B</text>
  </g>

  <g class="mono" font-size="15" fill="#5d5c56">
    <circle cx="98" cy="497" r="6" fill="#4a7a63"/>
    <text x="115" y="502">HOUSING</text>
    <circle cx="230" cy="497" r="6" fill="#6b8b4a"/>
    <text x="247" y="502">MONEY</text>
    <circle cx="345" cy="497" r="6" fill="#5a6bb0"/>
    <text x="362" y="502">TRANSIT</text>
    <circle cx="470" cy="497" r="6" fill="#3f9aa8"/>
    <text x="487" y="502">HEALTH</text>
    <circle cx="590" cy="497" r="6" fill="#c98a3a"/>
    <text x="607" y="502">FOOD</text>
    <circle cx="695" cy="497" r="6" fill="#8a8a3a"/>
    <text x="712" y="502">BYLAWS</text>
  </g>

  <text x="90" y="560" class="brand" font-size="17" fill="#3b3a35">occ-chatbot.vercel.app</text>
